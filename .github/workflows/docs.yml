name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - name: Check source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision="$(gh api repos/relanox/relanox/commits/master --jq .sha)"
          published="$(curl --fail --silent --max-time 15 https://relanox.github.io/source-commit.txt || true)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [ "$revision" = "$published" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.changed == 'true'
        with:
          repository: relanox/relanox
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.source.outputs.changed == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.source.outputs.changed == 'true'
        with:
          node-version: '26.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.source.outputs.changed == 'true'
      - run: pnpm docs:build
        if: steps.source.outputs.changed == 'true'
      - name: Record published source
        if: steps.source.outputs.changed == 'true'
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: printf '%s\n' "$SOURCE_REVISION" > docs/.vitepress/dist/source-commit.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.source.outputs.changed == 'true'
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
